[build]
builder = "nixpacks"
buildCommand = "npm install && npx prisma generate && npm run build"

[deploy]
startCommand = "npm start"

# NOTE: Database migrations and seeding removed from build
# - prisma migrate deploy: Removed because migrations should be run manually
# - prisma db seed: REMOVED - it deletes ALL data on every run!
# To set up a fresh database, run seed once manually via Railway CLI
