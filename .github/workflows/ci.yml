name: CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # LINT AND TYPE CHECK
  # ============================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            admin/package-lock.json
            web/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Lint backend
        working-directory: ./backend
        run: npm run lint || true # Don't fail on lint warnings for now

      - name: Type check backend
        working-directory: ./backend
        run: npm run typecheck

      - name: Install admin dependencies
        working-directory: ./admin
        run: npm ci

      - name: Type check admin
        working-directory: ./admin
        run: npm run lint || true

      - name: Install web dependencies
        working-directory: ./web
        run: npm ci

      - name: Type check web
        working-directory: ./web
        run: npm run lint || true

  # ============================================
  # BUILD TEST
  # ============================================
  build:
    name: Build Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            admin/package-lock.json
            web/package-lock.json

      - name: Build backend
        working-directory: ./backend
        run: |
          npm ci
          npm run build

      - name: Build admin
        working-directory: ./admin
        env:
          NEXT_PUBLIC_API_URL: https://api.femmelux.com/api
        run: |
          npm ci
          npm run build

      - name: Build web
        working-directory: ./web
        env:
          NEXT_PUBLIC_API_URL: https://api.femmelux.com/api
        run: |
          npm ci
          npm run build

  # ============================================
  # UNIT TESTS (when tests are added)
  # ============================================
  # test:
  #   name: Unit Tests
  #   runs-on: ubuntu-latest
  #   needs: lint
  #
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4
  #
  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: ${{ env.NODE_VERSION }}
  #
  #     - name: Install dependencies
  #       working-directory: ./backend
  #       run: npm ci
  #
  #     - name: Run tests
  #       working-directory: ./backend
  #       run: npm test

  # ============================================
  # SECURITY SCAN
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit (backend)
        working-directory: ./backend
        run: npm audit --audit-level=critical || true

      - name: Run npm audit (admin)
        working-directory: ./admin
        run: npm audit --audit-level=critical || true

      - name: Run npm audit (web)
        working-directory: ./web
        run: npm audit --audit-level=critical || true

  # ============================================
  # DEPLOY TO STAGING (on staging branch)
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'

    environment:
      name: staging
      url: https://staging.femmelux.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Railway Staging
        run: |
          echo "🚀 Deploying to staging environment..."
          # Railway auto-deploys from GitHub integration
          # This step is a placeholder for additional deployment logic
          echo "✅ Staging deployment triggered via Railway GitHub integration"

  # ============================================
  # DEPLOY TO PRODUCTION (on main branch)
  # ============================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://femmelux.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Railway Production
        run: |
          echo "🚀 Deploying to production environment..."
          # Railway auto-deploys from GitHub integration
          # This step is a placeholder for additional deployment logic
          echo "✅ Production deployment triggered via Railway GitHub integration"

      - name: Notify on success
        if: success()
        run: echo "✅ Production deployment successful!"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Production deployment failed!"
